# Only events that matter for a cluster, never a flood (#87): failing nodes,
# lasting Flux failures (#89), and Warning Events with a reason worth a message.
# FailedScheduling and Unhealthy (probes) stay out, they are too noisy.
# No collectors, no inventory on restart (pitchInitialList: false).
apiVersion: homerun2.sthings.io/v1alpha1
kind: K8sPitcherProfile
metadata:
  name: important-events
spec:
  cluster: my-cluster            # in-cluster there is no kubeconfig context
  pitcher:
    addr: https://omni.example.com/pitch
  auth:
    tokenFrom:
      secretKeyRef:
        name: omni-pitcher-token
        namespace: homerun2
        key: auth-token
  # The same object/reason or condition flip at most once per hour.
  cooldown: 1h
  # At most 20 messages per 10 minutes; anything above is replaced by one
  # "k8s-pitcher: N events suppressed" warning per window.
  rateLimit:
    max: 20
    per: 10m
  informers:
    # Nodes: NotReady <-> Ready. updates: flips everywhere: a generation
    # (spec) change is no news (#93).
    - group: ""
      version: v1
      resource: nodes
      events: [update]
      updates: flips
    # Flux: only lasting failures (#89). Every new revision flips each
    # Kustomization to Ready=Unknown (Progressing), often Ready=False
    # (DependencyNotReady), and back within seconds: those flips are
    # ignored. A failure is pitched once it has lasted 5 minutes (with how
    # long it has been failing), its recovery only if the failure was
    # pitched. Needs the k8s-pitcher release with #93 (updates: flips);
    # older images reject the profile at start-up.
    - group: kustomize.toolkit.fluxcd.io
      version: v1
      resource: kustomizations
      events: [update]
      updates: flips
      ignoreStatuses: [Unknown]
      ignoreReasons: [Progressing, DependencyNotReady, ReconciliationInProgress]
      minDuration: 5m
    - group: helm.toolkit.fluxcd.io
      version: v2
      resource: helmreleases
      events: [update]
      updates: flips
      ignoreStatuses: [Unknown]
      ignoreReasons: [Progressing, DependencyNotReady, ReconciliationInProgress]
      minDuration: 5m
    # Warning Events with an important reason
    - group: ""
      version: v1
      resource: events
      events: [add]
      types: [Warning]
      reasons:
        - BackOff
        - OOMKilling
        - Evicted
        - FailedMount
        - FailedAttachVolume
        - BackoffLimitExceeded
        - ProvisioningFailed
        - NodeNotReady
